# Starts a yok run from a pull request comment.
#
# The yok repo runs this file on its own pull requests. To use it in another repo, copy it to
# the same path there, then set these under that repo's Settings > Secrets and variables > Actions:
#   variable  YOK_SERVER_URL  the yok server's address, such as https://yok.example.com
#   variable  YOK_PROJECT     the repo's project name on that server
#                             (yok --remote project add NAME --git URL)
#   secret    YOK_USER, YOK_PASSWORD   the login Caddy asks for in front of the server
#
# Comment `@yok WHAT TO DO` on a pull request to run pr-fix on it, or
# `@yok --workflow NAME WHAT TO DO` for any workflow that takes a prompt. The prompt ends with a
# "Pull request: URL" line, so the run works on that pull request's own branch, and an
# "Asked in URL" line with the comment's link, so it knows which thread "this" means. The comment
# can be in the conversation, in a review thread, or in a review's summary. A review starts one
# run for its summary and one for each of its line comments that starts with @yok, so put @yok in
# the summary or on the lines, not both. @yok matches in any case, and a prompt wrapped whole in
# quotes, such as @yok "fix CI", loses the quotes.
# Only people with write access to the repo start runs: the job asks GitHub for the commenter's
# permission, because the event labels a member whose org membership is private CONTRIBUTOR.
# Once the run starts, the job replies where @yok was typed with a link to the run's page, as
# github-actions[bot]; the run itself pushes and replies with the yok server's own GitHub login.
name: yok

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# contents: read lets the job's token look up the commenter's permission; issues and
# pull-requests: write let it post the run's link on the conversation or in a review thread.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  start:
    if: >-
      startsWith(github.event.comment.body || github.event.review.body, '@yok')
      && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: Start a yok run
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.review.user.login }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}
          LINK: ${{ github.event.comment.html_url || github.event.review.html_url }}
          YOK_SERVER_URL: ${{ vars.YOK_SERVER_URL }}
          YOK_PROJECT: ${{ vars.YOK_PROJECT }}
          YOK_USER: ${{ secrets.YOK_USER }}
          YOK_PASSWORD: ${{ secrets.YOK_PASSWORD }}
        run: |
          set -euo pipefail
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission 2>/dev/null) || permission=none
          case "$permission" in
            admin|write) ;;
            *) echo "Ignored: $COMMENTER has $permission access to $REPO and cannot start yok runs."; exit 0 ;;
          esac
          # @yok in any case: GitHub's startsWith in the job's if: ignores case too.
          if [[ ! "${BODY,,}" =~ ^@yok([[:space:]]|$) ]]; then
            echo "Ignored: the comment does not start with @yok."
            exit 0
          fi
          for name in YOK_SERVER_URL YOK_PROJECT YOK_USER YOK_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set: add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          trim() {
            local text="$1"
            text="${text#"${text%%[![:space:]]*}"}"
            printf '%s' "${text%"${text##*[![:space:]]}"}"
          }
          text=$(trim "${BODY:4}")
          workflow=pr-fix
          if [[ "$text" =~ ^--workflow([[:space:]]|$) ]]; then
            text=$(trim "${text#--workflow}")
            workflow="${text%%[[:space:]]*}"
            text=$(trim "${text#"$workflow"}")
            if [ -z "$workflow" ]; then
              echo "::error::--workflow needs a workflow name."
              exit 1
            fi
          fi
          # A prompt wrapped whole in one pair of "…" or '…' loses that pair. "a" and "b" is not
          # one pair, so it stays as typed, and so do quotes inside the prompt.
          first="${text:0:1}"
          if [ ${#text} -ge 2 ] && [[ "$first" == '"' || "$first" == "'" ]]; then
            inner="${text:1:${#text}-2}"
            if [ "${text: -1}" = "$first" ] && [[ "$inner" != *"$first"* ]]; then
              text=$(trim "$inner")
            fi
          fi
          if [ -z "$text" ]; then
            echo "::error::Say what to do after @yok."
            exit 1
          fi
          text="$text"$'\n\n'"Pull request: $PR_URL"
          if [ -n "${LINK:-}" ]; then
            text="$text"$'\n'"Asked in $LINK"
          fi
          body=$(jq -n --arg project "$YOK_PROJECT" --arg workflow "$workflow" --arg prompt "$text" \
            '{project: $project, workflow: $workflow, inputs: {prompt: $prompt},
              policies: {interaction: false}}')
          reply=$(mktemp)
          status=$(curl -sS -o "$reply" -w '%{http_code}' -u "$YOK_USER:$YOK_PASSWORD" \
            -H 'Content-Type: application/json' --data "$body" "${YOK_SERVER_URL%/}/api/runs")
          if [ "$status" = 201 ]; then
            view=$(jq -r .view "$reply")
            echo "Started: $view"
            # The marker is the line pr-triage reads to leave yok's own replies out of the work.
            note=$(printf '<!-- yok:pr-reply -->\nStarted a yok run on this: %s' "$view")
            if [[ "${LINK:-}" =~ \#discussion_r([0-9]+)$ ]]; then
              gh api "repos/$REPO/pulls/${PR_URL##*/}/comments/${BASH_REMATCH[1]}/replies" \
                -f body="$note" --silent ||
                echo "::warning::The run started, but its link could not be posted in the thread."
            else
              gh pr comment "$PR_URL" --body "$note" ||
                echo "::warning::The run started, but its link could not be posted on the pull request."
            fi
            exit 0
          fi
          message=$(jq -r '.error | "\(.code): \(.message)"' "$reply" 2>/dev/null || cat "$reply")
          echo "::error::yok did not start the run (HTTP $status): $message"
          exit 1
