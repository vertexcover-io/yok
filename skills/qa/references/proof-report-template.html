<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Report</title>

<!-- ==========================================================================
     PROOF REPORT · fill the JSON island below, change nothing else.
     Every path is relative to this file, which sits in verification/.
     Omit any key you have nothing for and its section disappears.

     A scenario renders in this order:
       title          the question the scenario answers
       URL            url
       reason         under the URL, on a scenario that did not pass
       Given          given[]        the setup, one fact a line
       When → Then    steps[]        each thing the user does, with its checks under it
       Visual proof   recordings[]   every video of the scenario, with its screenshots
       Design check   visualMatch    the design beside the screen as built, then checks
       Files          artifacts[]
       free blocks    extra[]

     TOP LEVEL
       title       the feature, as a short phrase
       verdict     PASS | PARTIAL | FAIL, derived from coverage[]
       coverage[]  {req,scenario,verdict} — one row per requirement id the docs
                   list, reached or not. scenario: the n that proves it, or
                   "01, 09" when two scenarios do. The page does not show
                   it; the verdict and the stage's verifier read it.
       labels{}    rename a section: url, given, steps, media, frames,
                   visualMatch, files, bugs, gaps
       scenarios[] see below
       bugs[]      {severity,origin,reachedBy,scenario,title,body}
       gaps[]      {scenario,req,mechanism,attempted,wouldClose}

     SCENARIO
       n           stable two-digit number
       slug        NN_<slug>, the prefix of its first recording's files
       short       3-4 words, for the left rail
       group       the rail heading it is listed under: journey for a primary journey,
                   else the heading itself, a few plain words naming the
                   kind of check it is
       title       the question it answers
       verdict     SUCCESS | FAILURE | NOT VERIFIED | INVALID
       url         the path it opened on, query kept, host left out
       phone       {replay, why} on a browser scenario
                   replay: required | not needed
                   why: the one line that settled it
       thirdParty  the service whose own screen the checks are read on
       reason      on a scenario that did not pass
       given[]     plain sentences: the setup the scenario starts from
       steps[]     {when, checks[]} in the order they happen
                   when: what the user does at this step
                   checks[]: {text, result, saw, note, proofs[]}
                     text: what should be true once the step is done
                     result: pass | fail; left out where the step was not reached
                     saw: on a fail, what was seen instead
                     note: one line a reader needs beside the check
                     proofs[]: the ids of the proofs that back this check
       recordings[] {label, kind, device, browser, size, thirdParty, video, frames[], note}
                   label: the name on the card
                   size: phone on a phone replay
                   thirdParty: the service whose session filmed it
                   kind: how it was driven
                   device, browser: what it ran on
                   video: the file; its size, shape and length are read from it
                   frames[]: {src,label} in order
                   note: one line about this recording
       visualMatch {baseline, build, width, checks[]}
                   baseline: the design image, or null for a screen nobody drew
                   build: the screen as built, shown beside the baseline
                   width: the width of a re-shoot
                   checks[]: as a step's, and result may also be warn
       proofs[]    {id, label, claim, found, holds, raw, image}
                   id: what a check cites
                   label: two or three words naming where the proof comes from
                   claim: what it shows, one plain sentence
                   found: why it counts
                   holds: true, or false where it goes against the check
                   raw: the values its checks rest on, laid out to be read
                   image: a picture of what the witness showed
       artifacts[] {label,href,note} files the product produced
       extra[]     {heading,body,capture}

     **bold** works in every prose field. `code` works in reason, a bug's
     body, a gap's fields and extra[]; every other line a scenario shows is
     plain words.

     TO ADD A COMPONENT: see the SECTIONS registry in the script below. One
     entry plus one render function; nothing else moves.

     The videos, every frame and every file open in a modal, and all of them
     load from the report-media island below, which the qa skill's
     report-media script fills when run with --inline. Nothing loads from disk, so until it has run every frame shows as
     missing — and once it has, this file shows them wherever it is moved.
     ==== -->

<script type="application/json" id="report-media">{}</script>
<script type="application/json" id="report-data">
{
  "title": "<feature name>",
  "verdict": "<PASS | PARTIAL | FAIL, read off coverage[] and never chosen>",
  "coverage": [
    {
      "req": "<requirement id from the docs>",
      "scenario": "01",
      "verdict": "SUCCESS"
    },
    {
      "req": "<a requirement id this run did not prove>",
      "scenario": "02",
      "verdict": "NOT VERIFIED"
    }
  ],
  "scenarios": [
    {
      "n": "01",
      "slug": "01_<slug>",
      "short": "<3-4 words>",
      "group": "journey",
      "title": "<the question this scenario answers>",
      "verdict": "SUCCESS",
      "url": "<the path this opened on, with its query — not the host>",
      "given": [
        "<one fact the scenario starts from: the data, the setting, who the user is>",
        "<another>"
      ],
      "steps": [
        {
          "when": "<what the user does>",
          "checks": [
            {
              "text": "<what should be true once they have>",
              "result": "pass",
              "proofs": ["p1"]
            },
            {
              "text": "<another thing that should be true>",
              "result": "pass"
            }
          ]
        }
      ],
      "recordings": [
        {
          "label": "<the name on the card>",
          "kind": "<how it was driven>",
          "device": "<what it ran on>",
          "browser": "<the browser, where there is one>",
          "video": "01_<slug>.mp4",
          "frames": [
            {
              "src": "screenshots/01_<slug>__01_<step>.png",
              "label": "<what this frame shows>"
            }
          ]
        }
      ],
      "visualMatch": {
        "baseline": "<path to the design that defines this screen, or null if nobody drew it>",
        "build": "screenshots/01_<slug>.design.png",
        "width": 1440,
        "checks": [
          {
            "text": "<what the design asks of the screen>",
            "result": "pass",
            "proofs": ["p1"]
          }
        ]
      },
      "proofs": [
        {
          "id": "p1",
          "label": "<where it comes from>",
          "claim": "<what this shows, one plain sentence>",
          "found": "<why it counts>",
          "holds": true,
          "raw": "<the values this proof's checks rest on, laid out to be read>",
          "image": "<optional: screenshots/NN_SLUG.NAME.png>"
        }
      ],
      "artifacts": [
        {
          "label": "<file>",
          "href": "01_<slug>.<ext>",
          "note": "<size or kind>"
        }
      ],
      "extra": [
        {
          "heading": "<anything the sections above do not fit>",
          "body": "<free prose — as many paragraphs as it needs>",
          "capture": "<optional raw output>"
        }
      ]
    },
    {
      "n": "02",
      "slug": "02_<slug>",
      "short": "<3-4 words>",
      "group": "<a few words naming the kind of check this is>",
      "title": "<a question this run could not answer>",
      "verdict": "NOT VERIFIED",
      "reason": "<why it could not be driven, and what would close it>",
      "given": ["<the setup the scenario needs>"],
      "steps": [
        {
          "when": "<what the user would do>",
          "checks": [{ "text": "<what should be true>" }]
        }
      ]
    }
  ],
  "bugs": [
    {
      "severity": "blocker",
      "origin": "<introduced here | pre-existing | pre-existing, worsened here>",
      "reachedBy": "<the actor and the surface that produced this state — if you cannot name one, this is not a bug>",
      "scenario": "<n of the scenario that reproduces it — its checks and its recordings>",
      "title": "<what a maintainer would call it>",
      "body": "<what it is, and what blame or diff settled its origin>\n\n**Repro:** <steps>"
    }
  ],
  "gaps": [
    {
      "scenario": "<n of the NOT VERIFIED scenario this closes over>",
      "req": "<the requirement id it leaves uncovered>",
      "mechanism": "<the line, condition, credential or absent datum that blocked it>",
      "attempted": [
        "<a distinct approach you ran, not a retry of the one above>"
      ],
      "wouldClose": "<the concrete thing a human or a later run can supply>"
    }
  ]
}
</script>

<style>
:root {
  --bg:      #F4F6F8;
  --pane:    #FFFFFF;
  --rail:    #FAFBFC;
  --bar:     #FFFFFF;
  --line:    #DFE4EA;
  --line-2:  #EDF0F3;
  --fg:      #16202B;
  --fg-2:    #59677A;
  --fg-3:    #8A97A6;
  --accent:  #2F5BD0;
  --accent-w:#EAF0FD;
  --pass:    #16794C;
  --fail:    #C03221;
  --hold:    #96660A;
  --skip:    #6B7885;
  --code-bg: #F1F4F7;
  --pre-bg:  #171C24;
  --pre-fg:  #D6DEE8;

  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif;
  --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --bar-h: 46px;
  --rail-w: 272px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151A; --pane: #1A1E25; --rail: #15181E; --bar: #1A1E25;
    --line: #2B313A; --line-2: #232830;
    --fg: #E3E8EE; --fg-2: #98A4B3; --fg-3: #6E7C8C;
    --accent: #7FA0FF; --accent-w: #1E2740;
    --pass: #4FBF8B; --fail: #F1705C; --hold: #E0A93B; --skip: #8895A5;
    --code-bg: #232A33; --pre-bg: #0E1218; --pre-fg: #C6D1DE;
  }
}
:root[data-theme="dark"] {
  --bg: #12151A; --pane: #1A1E25; --rail: #15181E; --bar: #1A1E25;
  --line: #2B313A; --line-2: #232830;
  --fg: #E3E8EE; --fg-2: #98A4B3; --fg-3: #6E7C8C;
  --accent: #7FA0FF; --accent-w: #1E2740;
  --pass: #4FBF8B; --fail: #F1705C; --hold: #E0A93B; --skip: #8895A5;
  --code-bg: #232A33; --pre-bg: #0E1218; --pre-fg: #C6D1DE;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13.5px/1.55 var(--ui);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); }

/* ── sticky bar ─────────────────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 20; height: var(--bar-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px; background: var(--bar);
  border-bottom: 1px solid var(--line);
}
.bar__title {
  font-size: 14px; font-weight: 650; margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar__verdict {
  flex: none; font: 600 10.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 8px; border: 1px solid currentColor; border-radius: 4px;
}
.bar__spacer { flex: 1 1 auto; min-width: 8px; }
.bar__counts { display: flex; gap: 4px; flex: none; }
.count {
  display: flex; align-items: baseline; gap: 5px;
  padding: 4px 9px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--pane); white-space: nowrap;
  color: inherit; font: inherit; cursor: pointer;
}
.count:hover { border-color: var(--fg-3); }
.count__n { font: 600 13px/1 var(--mono); }
.count__l { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); }
.count--pass .count__n { color: var(--pass); }
.count--fail .count__n { color: var(--fail); }
.count--hold .count__n { color: var(--hold); }
.count--on { border-color: var(--accent); }
.bar__btn {
  flex: none; background: var(--pane); border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg-2); font: 11px/1 var(--ui); letter-spacing: .04em;
  padding: 7px 10px; cursor: pointer; text-transform: uppercase;
}
.bar__btn:hover { color: var(--fg); border-color: var(--fg-3); }

/* ── shell ──────────────────────────────────────────────── */
.shell {
  display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr);
  height: calc(100vh - var(--bar-h));
}

/* ── rail ───────────────────────────────────────────────── */
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  overflow-y: auto; padding-bottom: 24px;
}
.rail__h {
  font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg-3); padding: 14px 14px 7px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.rail__h b { font: 600 11px/1.5 var(--mono); color: var(--fg-3); }
.item {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start;
  width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-left: 3px solid transparent;
  padding: 8px 12px 8px 9px; color: inherit; font: inherit;
  border-bottom: 1px solid var(--line-2);
}
.item:hover { background: var(--pane); }
/* only problems carry colour, so the rail is scanned for what is wrong */
.item--fail { border-left-color: var(--fail); }
.item--hold { border-left-color: var(--hold); }
.item.is-on { background: var(--accent-w); border-left-color: var(--accent); }
.item__n { font: 600 11.5px/1.5 var(--mono); color: var(--fg-3); }
.item.is-on .item__n { color: var(--accent); }
.item__t {
  font-size: 12.5px; line-height: 1.4; min-width: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item.is-on .item__t { font-weight: 600; }
.item__v {
  font: 700 9.5px/1.6 var(--ui); letter-spacing: .08em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap;
}
.item__v.v--fail { background: var(--fail); color: #fff; }
.item__v.v--hold { background: var(--hold); color: #fff; }
.v--pass { color: var(--pass); }
.v--fail { color: var(--fail); }
.v--hold { color: var(--hold); }
.v--skip { color: var(--skip); }
.item.is-hidden { display: none; }
.grp > summary { cursor: pointer; list-style: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary > span::before { content: "▸ "; }
.grp[open] > summary > span::before { content: "▾ "; }
.grp > summary:hover { color: var(--fg); }
.grp.is-hidden { display: none; }
.rail__h b.is-hot { color: var(--fail); }
.grp > summary > b { white-space: nowrap; flex: none; }
.rail__sep { height: 1px; background: var(--line); margin: 10px 0 0; }
.item--aux { grid-template-columns: 1fr auto; }
.item--aux .item__t { -webkit-line-clamp: 1; font-size: 12.5px; color: var(--fg-2); }
.item--aux.is-on .item__t { color: var(--fg); }
.item__c { font: 600 11.5px/1.5 var(--mono); color: var(--fg-3); }
.item__c.is-hot { color: var(--fail); }

/* ── detail pane ────────────────────────────────────────── */
.pane { overflow-y: auto; background: var(--pane); }
.pane__in { padding: 18px 26px 80px; max-width: 1120px; margin-inline: auto; }

.head { display: flex; gap: 12px; align-items: flex-start; }
.head--fail, .head--hold { border-left: 3px solid var(--fail); padding-left: 11px; margin-left: -14px; }
.head--hold { border-left-color: var(--hold); }
.head__n { font: 600 13px/1.5 var(--mono); color: var(--fg-3); flex: none; padding-top: 2px; }
.head__t { font-size: 16px; font-weight: 600; line-height: 1.4; margin: 0; flex: 1; max-width: 90ch; }
.head__v {
  flex: none; font: 700 10.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 10px; border: 1px solid currentColor; border-radius: 4px;
}
.paths { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.path {
  font: 500 11.5px/1.7 var(--mono); color: var(--fg-2);
  background: var(--line-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 7px; word-break: break-all;
}

.summary { margin: 14px 0 0; font-size: 14px; color: var(--fg); max-width: 92ch; }
.summary p { margin: 0 0 9px; }
.summary p:last-child { margin: 0; }

.sec { margin-top: 22px; }
.sec__h {
  font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg-3); margin: 0 0 9px; display: flex; align-items: center; gap: 10px;
}
.sec__h::after { content: ""; flex: 1; height: 1px; background: var(--line); }


/* video + frames */
.strip {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}
.fr {
  background: none; border: 0; padding: 0; cursor: zoom-in;
  color: inherit; font: inherit; text-align: left; min-width: 0;
}
.fr img {
  width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top left;
  border: 1px solid var(--line); border-radius: 3px; display: block; background: var(--code-bg);
}
.fr:hover img { border-color: var(--accent); }
.fr.is-missing img { display: none; }
.fr.is-missing::before {
  content: "frame missing"; display: flex; align-items: center; justify-content: center;
  aspect-ratio: 16/10; border: 1px dashed var(--fail); border-radius: 3px;
  color: var(--fail); font-size: 11.5px; letter-spacing: .04em;
}
.fr__c { display: flex; gap: 6px; padding: 5px 1px 0; font-size: 11.5px; color: var(--fg-2); }
.fr__n { font: 600 10.5px/1.5 var(--mono); color: var(--fg-3); flex: none; }
.fr__l { line-height: 1.35; }

/* the video leads the section; screenshots fold away beneath it */
.shots { border: 1px solid var(--line); border-radius: 4px; background: var(--rail); }
.shots > summary {
  cursor: pointer; list-style: none; padding: 8px 12px;
  font-size: 12.5px; font-weight: 600; color: var(--fg-2);
  display: flex; gap: 9px; align-items: center;
}
.shots > summary::-webkit-details-marker { display: none; }
.shots > summary::before { content: "▸"; color: var(--fg-3); font-size: 10px; flex: none; }
.shots[open] > summary::before { content: "▾"; }
.shots > summary:hover { color: var(--fg); }
.shots[open] > summary { border-bottom: 1px solid var(--line); }
.shots__n { font: 600 11.5px/1.5 var(--mono); color: var(--fg-3); }
.shots__b { padding: 12px; background: var(--pane); border-radius: 0 0 3px 3px; }

.fr--v { cursor: pointer; }
.fr__wrap { position: relative; }
.fr--v .fr__wrap::after {
  content: ""; position: absolute; inset: 0; border-radius: 3px;
  background: linear-gradient(180deg, rgba(10,14,20,.16), rgba(10,14,20,.62));
}
.fr--v img { border-color: var(--accent); }
.fr__blank {
  aspect-ratio: 16/10; border: 1px solid var(--accent); border-radius: 3px;
  background: var(--pre-bg); display: block;
}
.fr__play {
  position: absolute; inset: 0; z-index: 1; display: flex;
  align-items: center; justify-content: center;
}
.fr__play span {
  width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.94);
  color: #16202B; display: flex; align-items: center; justify-content: center;
  font-size: 15px; padding-left: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.34);
}
.fr--v:hover .fr__play span { background: #fff; transform: scale(1.06); }
.fr__tag {
  position: absolute; left: 7px; top: 7px; z-index: 1;
  font: 700 9.5px/1.6 var(--ui); letter-spacing: .1em; text-transform: uppercase;
  background: var(--accent); color: #fff; border-radius: 3px; padding: 2px 6px;
}

/* design match — the baseline beside the build, then what diverged */
.vm__pair { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); max-width: 600px; }

/* supporting proofs: a folded row of mark, claim and plain finding, opening onto the raw original */
.proof__found { margin: 3px 0 0 19px; font-size: 13px; line-height: 1.5; color: var(--fg-2); font-weight: 400; }
.proof__found p { margin: 0; }

/* the folded proof row */
.proof__img { display: block; max-width: min(100%, 720px); max-height: 480px; width: auto; height: auto; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 6px; }
.cap {
  font: 11.5px/1.6 var(--mono); background: var(--pre-bg); color: var(--pre-fg);
  border-radius: 3px; padding: 10px 12px; margin: 0;
  max-height: 240px; overflow: auto; white-space: pre;
}

/* free blocks (s.extra) — prose with no imposed shape */
.blk { max-width: 92ch; margin-bottom: 18px; }
.blk:last-child { margin-bottom: 0; }
.blk__h { font-size: 14px; font-weight: 650; margin: 0 0 7px; }
.blk p { margin: 0 0 10px; font-size: 13.5px; }
.blk .cap { margin-top: 4px; }

/* files */
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file {
  display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none;
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px;
  color: var(--fg); font: 12.5px/1.55 var(--ui); background: var(--rail); cursor: pointer;
}
.file:hover { border-color: var(--accent); }
.file span { font: 11px/1.5 var(--mono); color: var(--fg-3); }

/* prose views (bugs / gaps) */
.prose { max-width: 84ch; font-size: 14px; }
.prose p { margin: 0 0 12px; }
.bug { border: 1px solid var(--line); border-left: 3px solid var(--fail); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; }
.bug--minor { border-left-color: var(--hold); }
.bug__h { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.bug__s {
  font: 700 9.5px/1.6 var(--ui); letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid currentColor; border-radius: 3px; padding: 1px 5px; color: var(--fail);
}
.bug--minor .bug__s { color: var(--hold); }
.bug__o {
  font: 600 9.5px/1.6 var(--ui); letter-spacing: .08em; text-transform: uppercase;
  border: 1px dashed currentColor; border-radius: 3px; padding: 1px 5px; color: var(--fg-2);
}
.bug__o--new { color: var(--fail); border-style: solid; }
.bug__r {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-2);
  font-size: 12.5px; color: var(--fg-2);
}
.bug__rl { font: 700 9.5px/1.6 var(--ui); letter-spacing: .1em; text-transform: uppercase; flex: none; }
.bug__rb { flex: 1 1 240px; }
.bug__go {
  flex: none; font: 600 12.5px/1.5 var(--ui); color: var(--fg);
  background: none; border: 1px solid var(--line-2); border-radius: 4px;
  padding: 2px 8px; cursor: pointer;
}
.bug__go:hover { border-color: currentColor; }
.bug__t { font-size: 14.5px; font-weight: 650; margin: 0; }
/* a gap is a bug's shape in the not-verified colour */
.bug--gap { border-left-color: var(--hold); }
.bug--gap .bug__s { color: var(--hold); }
.bug__at { margin: 0; padding-left: 17px; flex: 1 1 240px; }
.bug__at li { margin-bottom: 2px; }
.empty { color: var(--fg-2); font-size: 13.5px; }

code {
  font: .875em/1.4 var(--mono); background: var(--code-bg);
  padding: 1px 4px; border-radius: 3px;
}

/* modal */
.mo {
  position: fixed; inset: 0; z-index: 40; background: rgba(8,12,18,.72);
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.mo.is-open { display: flex; }
.mo__box {
  background: var(--pane); border: 1px solid var(--line); border-radius: 6px;
  max-width: min(1280px, 94vw); max-height: 92vh; width: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 48px rgba(0,0,0,.34);
}
.mo__bar {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--rail);
}
.mo__t { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mo__meta { font: 11.5px/1.5 var(--mono); color: var(--fg-3); flex: none; }
.mo__sp { flex: 1; }
.mo__btn {
  flex: none; background: var(--pane); border: 1px solid var(--line); border-radius: 4px;
  color: var(--fg-2); font: 11px/1 var(--ui); letter-spacing: .05em; text-transform: uppercase;
  padding: 7px 10px; cursor: pointer; text-decoration: none;
}
.mo__btn:hover { color: var(--fg); border-color: var(--fg-3); }
.mo__btn[disabled] { opacity: .35; cursor: default; }
.mo__body {
  flex: 1; min-height: 0; overflow: auto; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.mo__body--doc { display: block; align-items: stretch; background: var(--pane); }
.mo__body img, .mo__body video {
  max-width: 100%; max-height: 84vh; min-width: 0; min-height: 0;
  display: block; object-fit: contain;
}
.mo__pre {
  font: 12px/1.6 var(--mono); white-space: pre; margin: 0; padding: 14px 16px;
  color: var(--fg);
}
.mo__note { padding: 26px 20px; text-align: center; color: var(--fg-2); font-size: 13.5px; max-width: 62ch; }
.mo__note strong { color: var(--fg); }
.mo__tbl { width: 100%; border-collapse: collapse; font: 12px/1.5 var(--mono); }
.mo__tbl th, .mo__tbl td {
  border-bottom: 1px solid var(--line-2); border-right: 1px solid var(--line-2);
  padding: 4px 9px; text-align: left; white-space: nowrap;
  max-width: 320px; overflow: hidden; text-overflow: ellipsis;
}
.mo__tbl th { position: sticky; top: 0; background: var(--rail); font-weight: 600; z-index: 1; }
.mo__tbl td:first-child, .mo__tbl th:first-child { color: var(--fg-3); }
.mo__cap { flex: none; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); display: flex; gap: 10px; align-items: center; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
  .pane { overflow: visible; }
  .bar__title { display: none; }
  .bar__counts { display: none; }
  .pane__in { padding: 16px 14px 60px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .bar, .rail, .mo { display: none !important; }
  .shell { display: block; height: auto; }
  .pane { overflow: visible; }
  .cap { max-height: none; }
  .fr { break-inside: avoid; }
}

/* given — the setup, one fact a line */
.given { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; max-width: 92ch; }
.given li { padding: 2px 0; }

/* when → then — each step, with what should be true under it */
.stp { max-width: 1000px; }
.stp__row { display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; }
.stp__n {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--rail);
  font: 600 11.5px/22px var(--mono); color: var(--fg-2); text-align: center; grid-row: 1;
}
.stp__line { grid-column: 1; grid-row: 2; justify-self: center; width: 1px; background: var(--line); min-height: 10px; }
.stp__row:last-child .stp__line { background: none; }
.stp__when { margin: 0; font-size: 14px; font-weight: 600; line-height: 24px; }
.stp__body { grid-column: 2; grid-row: 2; padding: 5px 0 16px; }
.stp__row:last-child .stp__body { padding-bottom: 0; }

.chk { max-width: 1000px; border: 1px solid var(--line); border-radius: 4px; }
.chk__row {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 12px;
  border-bottom: 1px solid var(--line-2); font-size: 13.5px; line-height: 1.5;
}
.chk__row:last-child { border-bottom: 0; }
.chk__mark { flex: none; width: 16px; text-align: center; font-weight: 700; color: var(--fg-3); }
.is-pass > .chk__mark { color: var(--pass); }
.is-fail > .chk__mark { color: var(--fail); }
.is-warn > .chk__mark { color: var(--hold); }
.chk__main { flex: 1; min-width: 0; }
.chk__note { margin: 2px 0 0; font-size: 12.5px; color: var(--fg-2); }
.chk__saw { margin: 2px 0 0; font-size: 12.5px; color: var(--fail); }
.chk__proofs { margin: 4px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11.5px; color: var(--fg-3); }
.cite {
  font: 600 10.5px/1.5 var(--ui); color: var(--accent); background: var(--accent-w);
  border: 1px solid transparent; border-radius: 9px; padding: 0 7px; cursor: pointer; white-space: nowrap;
}
.cite::before { content: "▸ "; font-size: 8px; vertical-align: 1px; }
.cite:hover, .cite.is-on { border-color: var(--accent); }
.cite.is-on::before { content: "▾ "; }

/* a proof, opened under the check it backs */
.proof { margin: 7px 0 4px; border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; background: var(--rail); }
.proof__h { margin: 0 0 3px; font-size: 13px; font-weight: 650; display: flex; gap: 7px; align-items: baseline; }
.proof__mark { flex: none; color: var(--pass); font-weight: 700; }
.proof--no .proof__mark { color: var(--fail); }
.proof--unset .proof__mark { color: var(--hold); }
.proof .proof__found { margin: 0 0 8px; }
.proof .cap { white-space: pre-wrap; max-height: 320px; }

/* recordings — every video of the scenario, with what it was filmed on */
.recs { display: grid; gap: 10px; max-width: 1000px; }
.rec { display: flex; gap: 14px; border: 1px solid var(--line); border-radius: 4px; padding: 10px; background: var(--rail); }
.rec__thumb {
  position: relative; flex: none; width: 208px; height: 130px; padding: 0; cursor: pointer;
  border: 1px solid var(--accent); border-radius: 3px; overflow: hidden; background: var(--pre-bg);
}
.rec__thumb img, .rec__thumb video { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
.rec--tall .rec__thumb img, .rec--tall .rec__thumb video { object-fit: contain; object-position: center; }
.rec__thumb::after { content: ""; position: absolute; inset: 0; background: rgba(10,14,20,.28); }
.rec__body { flex: 1; min-width: 0; }
.rec__t { font-size: 13.5px; font-weight: 650; margin: 0 0 6px; }
.rec__meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 16px; margin: 0; }
.rec__meta dt { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.rec__meta dd { margin: 0; font-size: 12.5px; }
.rec__note { margin: 7px 0 0; font-size: 12px; color: var(--fg-2); }
.rec .shots { margin-top: 9px; background: var(--pane); }
@media (max-width: 640px) { .rec { flex-direction: column; } .rec__thumb { width: 100%; height: 170px; } }

/* design check — the design beside the screen as built, then the checks */
.dsg__ref { margin: 0 0 8px; font-size: 13px; color: var(--fg-2); max-width: 92ch; }
.vm__pair { margin-bottom: 12px; }
</style>
</head>
<body>

<header class="bar">
  <h1 class="bar__title" id="b-title"></h1>
  <span class="bar__verdict" id="b-verdict" hidden></span>
  <span class="bar__spacer"></span>
  <div class="bar__counts" id="b-counts"></div>
  <button class="bar__btn" id="b-theme" title="Toggle theme">Theme</button>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Scenarios"></nav>
  <section class="pane"><div class="pane__in" id="pane"></div></section>
</div>

<div class="mo" id="mo" role="dialog" aria-modal="true" aria-label="Evidence">
  <div class="mo__box">
    <div class="mo__bar">
      <span class="mo__t" id="mo-t"></span>
      <span class="mo__meta" id="mo-meta"></span>
      <span class="mo__sp"></span>
      <button class="mo__btn" id="mo-prev" title="Previous (←)">‹</button>
      <button class="mo__btn" id="mo-next" title="Next (→)">›</button>
      <a class="mo__btn" id="mo-open" target="_blank" rel="noopener">Open</a>
      <button class="mo__btn" id="mo-x">Close · Esc</button>
    </div>
    <div class="mo__body" id="mo-b"></div>
    <div class="mo__cap" id="mo-cap"></div>
  </div>
</div>

<script>
(() => {
  const D = JSON.parse(document.getElementById('report-data').textContent);
  /* report-media maps a path the data names to that file as a data URI — written by
     the qa skill's report-media script run with --inline, never by hand. Nothing loads from disk: a path it does
     not hold shows as missing here too, not only once the report has been moved. */
  const MEDIA = JSON.parse(document.getElementById('report-media').textContent);
  const res = p => MEDIA[p] || '';
  const NOT_INLINED = '<strong>This file is not inside the report.</strong> ' +
    'Run the qa skill\'s report-media script with --inline and fix whatever it prints as FAILED.';
  const S = D.scenarios || [], BUGS = D.bugs || [], GAPS = D.gaps || [];

  const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const paras = (h, s) => String(s).split(/\n\n+/).forEach(p => { const n = el('p'); n.innerHTML = rich(p); h.appendChild(n); });
  const kind = v => {
    const u = String(v || '').toUpperCase();
    if (u.startsWith('SUCC') || u === 'PASS') return 'pass';
    if (u.startsWith('FAIL')) return 'fail';
    if (u.startsWith('NOT')) return 'hold';
    return 'skip';
  };
  const label = v => {
    const k = kind(v);
    return k === 'pass' ? 'Pass' : k === 'fail' ? 'Fail' : k === 'hold' ? 'Not verified' : (v || 'n/a');
  };

  const L = Object.assign({
    url: 'URL',
    given: 'Given',
    steps: 'When → Then',
    media: 'Visual proof',
    frames: 'Screenshots',
    visualMatch: 'Design check',
    files: 'Files',
    bugs: 'Bugs',
    gaps: 'What this run did not reach'
  }, D.labels || {});

  const kinds = S.map(s => kind(s.verdict));
  const n = { pass: 0, fail: 0, hold: 0, skip: 0 };
  kinds.forEach(k => n[k]++);

  /* ── bar ── */
  document.getElementById('b-title').textContent = D.title || 'Proof Report';
  document.title = 'Proof · ' + (D.title || '');

  const topVerdict = D.verdict;
  if (topVerdict) {
    const vb = document.getElementById('b-verdict');
    const text = String(topVerdict).split(/\s[—-]\s/)[0];
    vb.textContent = text;
    vb.classList.add('v--' + kind(text.split(/[\s—-]/)[0]));
    vb.hidden = false;
  }

  let filter = 'all';
  const counts = document.getElementById('b-counts');
  const defs = [
    ['all',  S.length, S.length === 1 ? 'scenario' : 'scenarios', ''],
    ['pass', n.pass,  'pass', 'pass'],
    ['fail', n.fail,  'fail', 'fail'],
    ['hold', n.hold,  'not verified', 'hold'],
    ['bugs', BUGS.length, BUGS.length === 1 ? 'bug' : 'bugs', BUGS.length ? 'fail' : '']
  ];
  const chips = {};
  defs.forEach(([key, v, txt, tone]) => {
    if (!v && (key === 'hold' || key === 'fail')) return;
    const b = el('button', 'count' + (tone ? ' count--' + tone : ''));
    b.type = 'button';
    b.appendChild(el('span', 'count__n', String(v)));
    b.appendChild(el('span', 'count__l', txt));
    if (key === 'bugs') {
      b.addEventListener('click', () => select(key));
    } else {
      b.addEventListener('click', () => { filter = filter === key ? 'all' : key; paint(); });
      chips[key] = b;
    }
    counts.appendChild(b);
  });

  const root = document.documentElement;
  document.getElementById('b-theme').addEventListener('click', () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = root.getAttribute('data-theme') || (dark ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  /* ── rail ── */
  const rail = document.getElementById('rail');
  let current = 'bugs';
  const aux = [];

  /* Scenarios are listed under headings: the primary journeys first, then each
     group the run named, in the order the scenarios first use it. */
  const JOURNEYS = 'Primary journeys';
  const groupOf = (s) => s.group === 'journey' ? JOURNEYS : s.group || 'Other scenarios';
  const GROUPS = [JOURNEYS, ...S.map(groupOf)].filter((name, i, all) => all.indexOf(name) === i);
  const rows = [];
  const order = [];
  const groups = GROUPS.map((name) => {
    const members = S.map((s, i) => i).filter((i) => groupOf(S[i]) === name);
    if (!members.length) return null;
    const box = el('details', 'grp');
    box.open = true;
    const h = el('summary', 'rail__h');
    h.appendChild(el('span', null, name));
    const failing = members.filter((i) => kinds[i] === 'fail').length;
    h.appendChild(el('b', failing ? 'is-hot' : null,
      failing ? failing + '/' + members.length + ' failed' : String(members.length)));
    box.appendChild(h);
    members.forEach((i) => {
      const s = S[i];
      const b = el('button', 'item item--' + kinds[i]);
      b.type = 'button';
      b.appendChild(el('span', 'item__n', s.n || String(i + 1).padStart(2, '0')));
      b.appendChild(el('span', 'item__t', s.short || s.title || ''));
      b.appendChild(el('span', 'item__v v--' + kinds[i], label(s.verdict)));
      b.addEventListener('click', () => select(i));
      box.appendChild(b);
      rows[i] = b;
      order.push(i);
    });
    rail.appendChild(box);
    return [box, members];
  }).filter(Boolean);
  if (!S.length) rail.appendChild(el('div', 'rail__h', 'none'));

  rail.appendChild(el('div', 'rail__sep'));
  rail.appendChild(el('div', 'rail__h', 'Report'));
  [['bugs', L.bugs, BUGS.length, BUGS.length ? 'fail' : ''],
   ['gaps', 'Not reached', GAPS.length, '']].forEach(([id, txt, c, tone]) => {
    if (id === 'gaps' && !GAPS.length) return;
    const b = el('button', 'item item--aux' + (tone ? ' item--' + tone : ''));
    b.type = 'button';
    b.appendChild(el('span', 'item__t', txt));
    b.appendChild(el('span', 'item__c' + (tone === 'fail' ? ' is-hot' : ''), String(c)));
    b.addEventListener('click', () => select(id));
    rail.appendChild(b);
    aux.push([id, b]);
  });

  /* ── detail ── */
  const pane = document.getElementById('pane');

  /* A {heading, body, capture} block. Every key optional. `capture` is raw
     output shown as-is; `body` splits into paragraphs on a blank line. */
  function block(host, b) {
    if (b.heading) host.appendChild(el('h3', 'blk__h', b.heading));
    if (b.body) paras(host, b.body);
    if (b.capture) host.appendChild(el('pre', 'cap', b.capture));
  }

  /* One tile in the Visual proof grid — a frame, or the video with its play badge. */
  function tile({ src, cap, video, n }) {
    const b = el('button', 'fr' + (video ? ' fr--v' : '')); b.type = 'button';
    const wrap = el('div', 'fr__wrap');
    if (src) {
      const img = el('img'); img.alt = video ? '' : cap; img.loading = 'lazy';
      const missing = () => {
        if (video) { img.remove(); wrap.insertBefore(el('div', 'fr__blank'), wrap.firstChild); }
        else { b.classList.add('is-missing'); b.disabled = true; }
      };
      img.addEventListener('error', missing);
      wrap.appendChild(img);
      if (res(src)) img.src = res(src); else missing();
    } else {
      wrap.appendChild(el('div', 'fr__blank'));
    }
    if (video) {
      wrap.appendChild(el('span', 'fr__tag', 'Video'));
      const play = el('div', 'fr__play'); play.appendChild(el('span', null, '▶'));
      wrap.appendChild(play);
    }
    b.appendChild(wrap);
    const c = el('div', 'fr__c');
    c.appendChild(el('span', 'fr__n', n));
    c.appendChild(el('span', 'fr__l', cap));
    b.appendChild(c);
    return b;
  }

  /* The one accepted shape is a string; an author who writes an object gets the
     path out of it rather than [object Object]. Anything carrying no path at all
     returns '', which every guard below reads as "render no URL". */
  const pathText = u => (typeof u === 'string' ? u : (u && (u.path || u.url))) || '';
  const pathChip = (cls, u) => el('code', cls, pathText(u));

  const frameList = s => (s.frames || []).map(f => {
    const src = typeof f === 'string' ? f : f.src;
    return {
      src,
      cap: (typeof f === 'string' ? '' : f.label) ||
        src.split('/').pop().replace(/\.\w+$/, '').split('__').pop().replace(/^\d+_/, '').replace(/_/g, ' ')
    };
  });

  /* URL — FIXED FORMAT. s.url: the path this scenario opened on, without the host. */
  function renderPaths(sec, s) {
    const row = el('div', 'paths');
    row.appendChild(pathChip('path', s.url));
    sec.appendChild(row);
  }

  /* Reason — why a scenario did not pass. Headingless: it has no key in L. */
  function renderReason(sec, s) {
    const d = el('div', 'summary');
    paras(d, s.reason);
    sec.appendChild(d);
  }

  const filled = v => (Array.isArray(v) ? v.length : v);

  /* Given — s.given[]: the setup the scenario starts from, one fact a line. */
  function renderGiven(sec, s) {
    const ul = el('ul', 'given');
    s.given.forEach(x => { const li = el('li'); li.innerHTML = rich(x); ul.appendChild(li); });
    sec.appendChild(ul);
  }

  /* Only a proof that says it holds gets the pass mark. */
  const PROOF_MARKS = {
    true:  { cls: '',              text: '✓' },
    false: { cls: ' proof--no',    text: '✕' },
    unset: { cls: ' proof--unset', text: '?' },
  };

  /* A check's mark is its result; a check the run did not reach has none. */
  const CHECK_MARKS = {
    pass:  { cls: 'is-pass', text: '✔' },
    fail:  { cls: 'is-fail', text: '✘' },
    warn:  { cls: 'is-warn', text: '!' },
    unset: { cls: 'is-none', text: '–' },
  };

  /* One proof, opened under the check that cites it: its mark and claim, why it
     counts, its picture when it has one, and the original. */
  function proofBox(pr) {
    const mark = PROOF_MARKS[String(pr.holds)] || PROOF_MARKS.unset;
    const box = el('div', 'proof' + mark.cls);
    const h = el('p', 'proof__h');
    h.appendChild(el('span', 'proof__mark', mark.text));
    const c = el('span'); c.innerHTML = rich(pr.claim || ''); h.appendChild(c);
    box.appendChild(h);
    if (pr.found) { const f = el('div', 'proof__found'); paras(f, pr.found); box.appendChild(f); }
    if (pr.image && res(pr.image)) {
      const img = el('img', 'proof__img'); img.src = res(pr.image); img.alt = pr.claim || ''; box.appendChild(img);
    } else if (pr.image) {
      box.appendChild(el('p', 'empty', 'This picture is not inside the report: ' + pr.image));
    }
    if (pr.raw) box.appendChild(el('pre', 'cap', pr.raw));
    return box;
  }

  /* The proofs behind one check: a pill each, named by the proof's label. A pill
     opens its proof right under the check. */
  function proofPills(main, prs) {
    const bar = el('div', 'chk__proofs');
    bar.appendChild(el('span', null, 'Proof'));
    const host = el('div');
    let on = null;
    prs.forEach(pr => {
      const b = el('button', 'cite', pr.label || pr.id); b.type = 'button';
      b.addEventListener('click', () => {
        bar.querySelectorAll('.cite').forEach(x => x.classList.remove('is-on'));
        host.textContent = '';
        if (on === pr) { on = null; return; }
        on = pr; b.classList.add('is-on'); host.appendChild(proofBox(pr));
      });
      bar.appendChild(b);
    });
    main.appendChild(bar);
    main.appendChild(host);
  }

  /* checks[] — {text, result, saw, note, proofs[]}: one line per thing that should
     be true, its mark, and the proofs it cites out of s.proofs[]. */
  function checkList(host, s, checks) {
    const box = el('div', 'chk');
    checks.forEach(c => {
      const mark = CHECK_MARKS[c.result] || CHECK_MARKS.unset;
      const row = el('div', 'chk__row ' + mark.cls);
      row.appendChild(el('span', 'chk__mark', mark.text));
      const main = el('div', 'chk__main');
      const t = el('span'); t.innerHTML = rich(c.text || ''); main.appendChild(t);
      if (c.note) main.appendChild(el('p', 'chk__note', c.note));
      if (c.result === 'fail' && c.saw) main.appendChild(el('p', 'chk__saw', 'Seen instead: ' + c.saw));
      const prs = (c.proofs || []).map(id => (s.proofs || []).find(p => p.id === id)).filter(Boolean);
      if (prs.length) proofPills(main, prs);
      row.appendChild(main);
      box.appendChild(row);
    });
    host.appendChild(box);
  }

  /* When → Then — s.steps[]: {when, checks[]}. Read top to bottom: each thing the
     user does, and under it what should be true at that moment. */
  function renderSteps(sec, s) {
    const host = el('div', 'stp');
    s.steps.forEach((st, i) => {
      const row = el('div', 'stp__row');
      row.appendChild(el('span', 'stp__n', String(i + 1)));
      const w = el('p', 'stp__when'); w.innerHTML = rich(st.when || ''); row.appendChild(w);
      row.appendChild(el('span', 'stp__line'));
      const body = el('div', 'stp__body');
      if (filled(st.checks)) checkList(body, s, st.checks);
      row.appendChild(body);
      host.appendChild(row);
    });
    sec.appendChild(host);
  }

  /* A video's shape as the nearest familiar ratio, else as a number. */
  const RATIOS = [['16:9', 16 / 9], ['16:10', 1.6], ['3:2', 1.5], ['4:3', 4 / 3], ['1:1', 1],
                  ['3:4', 0.75], ['2:3', 2 / 3], ['10:16', 0.625], ['9:16', 9 / 16], ['9:19.5', 9 / 19.5]];
  const ratioOf = (w, h) => {
    const near = RATIOS.find(([, v]) => Math.abs(v - w / h) / v < 0.02);
    return near ? near[0] : (w / h).toFixed(2) + ':1';
  };
  const lengthOf = secs => secs < 60
    ? Math.round(secs) + ' s'
    : Math.floor(secs / 60) + ' min ' + Math.round(secs % 60) + ' s';

  /* Visual proof — s.recordings[]: {label, kind, device, browser, video, frames[], note}.
     One card a recording. Its size, shape and length are read from the video itself. */
  function renderRecordings(sec, s) {
    const list = el('div', 'recs');
    s.recordings.forEach(r => {
      const frames = frameList(r);
      const card = el('div', 'rec');
      const th = el('button', 'rec__thumb'); th.type = 'button'; th.title = 'Play';
      if (frames[0] && res(frames[0].src)) { const img = el('img'); img.src = res(frames[0].src); img.alt = ''; th.appendChild(img); }
      const play = el('div', 'fr__play'); play.appendChild(el('span', null, '▶')); th.appendChild(play);
      th.addEventListener('click', () => openModal({
        title: (r.label || 'The run') + ' · ' + (s.short || s.n), kind: 'video', src: r.video
      }));
      card.appendChild(th);
      const body = el('div', 'rec__body');
      body.appendChild(el('p', 'rec__t', r.label || 'Recording'));
      const dl = el('dl', 'rec__meta');
      const field = (k, v) => {
        const d = el('div'); d.appendChild(el('dt', null, k));
        const dd = el('dd', null, v); d.appendChild(dd); dl.appendChild(d);
        return dd;
      };
      if (r.kind && r.kind !== r.label) field('Type', r.kind);
      if (r.device) field('Device', r.device);
      if (r.browser) field('Browser', r.browser);
      if (res(r.video)) {
        const size = field('Video', '…'), length = field('Length', '…');
        const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true;
        /* A recording with no frame shows its own opening picture. */
        if (!frames[0]) th.insertBefore(v, play);
        v.addEventListener('loadedmetadata', () => {
          size.textContent = v.videoWidth + ' × ' + v.videoHeight + ' · ' + ratioOf(v.videoWidth, v.videoHeight);
          length.textContent = lengthOf(v.duration);
          card.classList.toggle('rec--tall', v.videoHeight > v.videoWidth);
        });
        v.src = res(r.video);
      }
      body.appendChild(dl);
      if (r.note) body.appendChild(el('p', 'rec__note', r.note));
      if (frames.length) {
        const d = el('details', 'shots');
        d.open = !!r.framesOpen;
        const sum = el('summary');
        sum.appendChild(document.createTextNode(L.frames));
        sum.appendChild(el('span', 'shots__n', String(frames.length)));
        d.appendChild(sum);
        const strip = el('div', 'strip');
        frames.forEach((f, j) => {
          const t = tile({ src: f.src, cap: f.cap, n: String(j + 1).padStart(2, '0') });
          t.addEventListener('click', () => openModal({ kind: 'image', gallery: frames, index: j }));
          strip.appendChild(t);
        });
        const b = el('div', 'shots__b'); b.appendChild(strip); d.appendChild(b);
        body.appendChild(d);
      }
      card.appendChild(body);
      list.appendChild(card);
    });
    sec.appendChild(list);
  }

  /* Design check — s.visualMatch: {baseline, build, width, checks[]}. Says what the
     screen was compared with, shows the design beside the screen as built, then
     lists the checks. */
  function renderVisualMatch(sec, s) {
    const vm = s.visualMatch;
    sec.appendChild(el('p', 'dsg__ref', vm.baseline
      ? 'Compared with the approved design.'
      : 'No design draws this screen, so it was checked for readability and layout.'));
    if (vm.baseline) {
      const pair = [{ src: vm.baseline, cap: 'Design' }];
      if (vm.build) pair.push({ src: vm.build, cap: vm.width ? 'Built, at ' + vm.width + 'px' : 'Built' });
      const grid = el('div', 'vm__pair');
      pair.forEach((p, j) => {
        const t = tile({ src: p.src, cap: p.cap, n: j ? '02' : '01' });
        t.addEventListener('click', () => openModal({ kind: 'image', gallery: pair, index: j }));
        grid.appendChild(t);
      });
      sec.appendChild(grid);
    }
    checkList(sec, s, vm.checks);
  }

  /* Files — s.artifacts[]: {label, href, note}. href is relative to this file;
     the modal previews csv, json, text, images and video. */
  function renderFiles(sec, s) {
    const f = el('div', 'files');
    s.artifacts.forEach(x => {
      const a = el('button', 'file'); a.type = 'button';
      a.appendChild(document.createTextNode(x.label));
      if (x.note) a.appendChild(el('span', null, x.note));
      a.addEventListener('click', () => openFile(x));
      f.appendChild(a);
    });
    sec.appendChild(f);
  }

  /* Free blocks — s.extra[]: {heading, body, capture}, all optional.
     No forced shape: put anything here the four sections above do not fit. */
  function renderExtra(sec, s) {
    s.extra.forEach(b => {
      const d = el('div', 'blk');
      block(d, b);
      sec.appendChild(d);
    });
  }

  /* The sections of a scenario, in render order.
     [ key, guard, renderer ] — key is also the heading looked up in L.
     To add your own: write render(sec, s) that appends to sec, add an entry here,
     and put the field in the JSON. */
  const SECTIONS = [
    ['url',    s => pathText(s.url),                              renderPaths],
    ['reason', s => s.reason,                                     renderReason],
    ['given',  s => filled(s.given),                              renderGiven],
    ['steps',  s => filled(s.steps),                              renderSteps],
    ['media',  s => filled(s.recordings),                         renderRecordings],
    ['visualMatch', s => s.visualMatch && (s.visualMatch.checks || []).length > 0,
                                                                  renderVisualMatch],
    ['files',  s => s.artifacts && s.artifacts.length,            renderFiles],
    ['extra',  s => s.extra && s.extra.length,                    renderExtra],
  ];

  function drawScenario(s, i) {
    const k = kinds[i];
    pane.textContent = '';

    const head = el('div', 'head' + (k === 'fail' || k === 'hold' ? ' head--' + k : ''));
    head.appendChild(el('span', 'head__n', s.n || ''));
    const h = el('h2', 'head__t'); h.innerHTML = rich(s.title || '');
    head.appendChild(h);
    head.appendChild(el('span', 'head__v v--' + k, label(s.verdict)));
    pane.appendChild(head);

    SECTIONS.forEach(([key, has, render]) => {
      if (!has(s)) return;
      const sec = el('div', 'sec');
      if (L[key]) sec.appendChild(el('p', 'sec__h', L[key]));
      render(sec, s);
      pane.appendChild(sec);
    });
  }

  const prose = t => { const p = el('div', 'prose'); paras(p, t); return p; };

  /* A labelled row under a bug or a gap. `body` is prose, or a node when the
     row carries a list or a button. */
  function metaRow(box, label, body) {
    const r = el('div', 'bug__r');
    r.appendChild(el('span', 'bug__rl', label));
    r.appendChild(typeof body === 'string' ? el('span', 'bug__rb', body) : body);
    box.appendChild(r);
  }

  /* The same row, pointing at the scenario an entry names — a button that walks
     there, so a bug reaches its repro and a gap reaches what it left unproven. */
  function scenarioRow(box, label, ref) {
    const i = S.findIndex(s => String(s.n) === String(ref));
    if (i < 0) return metaRow(box, label, 'Scenario ' + ref + ' (missing)');
    const a = el('button', 'bug__go', 'Scenario ' + S[i].n + ' — ' + (S[i].short || S[i].title || ''));
    a.addEventListener('click', () => select(i));
    metaRow(box, label, a);
  }

  function drawBugs() {
    pane.textContent = '';
    const head = el('div', 'head');
    head.appendChild(el('h2', 'head__t', L.bugs));
    head.appendChild(el('span', 'head__v v--' + (BUGS.length ? 'fail' : 'pass'), BUGS.length ? BUGS.length + ' found' : 'None found'));
    pane.appendChild(head);
    const sec = el('div', 'sec');
    BUGS.forEach(b => {
      const box = el('div', 'bug' + (/minor/i.test(b.severity || '') ? ' bug--minor' : ''));
      const h = el('div', 'bug__h');
      h.appendChild(el('span', 'bug__s', b.severity || 'bug'));
      if (b.origin) h.appendChild(el('span', 'bug__o' + (/introduced/i.test(b.origin) ? ' bug__o--new' : ''), b.origin));
      h.appendChild(el('h3', 'bug__t', b.title || ''));
      box.appendChild(h);
      const p = el('div', 'prose'); if (b.body) paras(p, b.body);
      box.appendChild(p);
      if (b.reachedBy) metaRow(box, 'Reached by', b.reachedBy);
      if (b.scenario != null) scenarioRow(box, 'Proven in', b.scenario);
      sec.appendChild(box);
    });
    if (!BUGS.length) sec.appendChild(el('p', 'empty', 'No bugs found.'));
    pane.appendChild(sec);
  }

  function drawGaps() {
    pane.textContent = '';
    const head = el('div', 'head');
    head.appendChild(el('h2', 'head__t', L.gaps));
    head.appendChild(el('span', 'head__v v--hold', GAPS.length + ' item' + (GAPS.length === 1 ? '' : 's')));
    pane.appendChild(head);
    const sec = el('div', 'sec');
    GAPS.forEach(g => sec.appendChild(typeof g === 'string' ? prose(g) : gapBox(g)));
    pane.appendChild(sec);
  }

  /* One gap — {scenario, req, mechanism, attempted[], wouldClose}: the cause that
     blocked a NOT VERIFIED scenario, what was tried against it, and what unblocks
     it. Rendered as a bug in the not-verified colour, since it reads the same way. */
  function gapBox(g) {
    const box = el('div', 'bug bug--gap');
    const h = el('div', 'bug__h');
    if (g.req) h.appendChild(el('span', 'bug__s', g.req));
    const named = S.find(s => String(s.n) === String(g.scenario));
    h.appendChild(el('h3', 'bug__t', (named && (named.short || named.title)) || 'Not reached'));
    box.appendChild(h);
    if (g.mechanism) box.appendChild(prose(g.mechanism));
    if (g.attempted && g.attempted.length) {
      const ul = el('ul', 'bug__at');
      g.attempted.forEach(a => { const li = el('li'); li.innerHTML = rich(a); ul.appendChild(li); });
      metaRow(box, 'Attempted', ul);
    }
    if (g.wouldClose) metaRow(box, 'Would close', g.wouldClose);
    if (g.scenario != null) scenarioRow(box, 'Not verified in', g.scenario);
    return box;
  }

  function select(id) {
    current = id;
    rows.forEach((b, i) => b.classList.toggle('is-on', i === id));
    aux.forEach(([k, b]) => b.classList.toggle('is-on', k === id));
    if (id === 'bugs') drawBugs();
    else if (id === 'gaps') drawGaps();
    else drawScenario(S[id], id);
    document.querySelector('.pane').scrollTop = 0;
  }

  function paint() {
    Object.entries(chips).forEach(([k, b]) => b.classList.toggle('count--on', filter === k));
    let firstVisible = null;
    order.forEach((i) => {
      const show = filter === 'all' || kinds[i] === filter;
      rows[i].classList.toggle('is-hidden', !show);
      if (show && firstVisible === null) firstVisible = i;
    });
    groups.forEach(([box, members]) =>
      box.classList.toggle('is-hidden', members.every((i) => rows[i].classList.contains('is-hidden'))));
    if (typeof current === 'number' && rows[current] && rows[current].classList.contains('is-hidden')) {
      select(firstVisible === null ? 'bugs' : firstVisible);
    }
  }

  /* keyboard: j/k or arrows walk the visible list */
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (document.getElementById('mo').classList.contains('is-open')) return;
    const vis = order.filter((i) => !rows[i].classList.contains('is-hidden'));
    if (!vis.length) return;
    const at = vis.indexOf(current);
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); select(vis[Math.min(vis.length - 1, at + 1)] ?? vis[0]); }
    if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); select(vis[Math.max(0, at - 1)] ?? vis[0]); }
  });

  /* ── modal ── */
  const mo = document.getElementById('mo'), moB = document.getElementById('mo-b'),
        moT = document.getElementById('mo-t'), moMeta = document.getElementById('mo-meta'),
        moCap = document.getElementById('mo-cap'), moOpen = document.getElementById('mo-open'),
        moPrev = document.getElementById('mo-prev'), moNext = document.getElementById('mo-next');
  let back = null, gallery = null, gi = 0;
  const MAX_ROWS = 400, MAX_CHARS = 300000;
  const extOf = h => (String(h).split(/[?#]/)[0].split('.').pop() || '').toLowerCase();

  /* The Open button hands the reader the inlined copy. It goes through a Blob URL
     because a browser refuses to open a data: URI as a page, and it is prepared
     ahead of the click so the button stays a plain link no popup blocker stops.
     A file that was not inlined gets no button. */
  let openUrl = null;
  function setOpen(path) {
    if (openUrl) { URL.revokeObjectURL(openUrl); openUrl = null; }
    moOpen.style.display = 'none';
    moOpen.removeAttribute('href');
    moOpen.dataset.path = path || '';
    if (!res(path)) return;
    fetch(res(path)).then(r => r.blob()).then(blob => {
      if (moOpen.dataset.path !== path) return;
      openUrl = URL.createObjectURL(blob);
      moOpen.href = openUrl; moOpen.style.display = '';
    }).catch(() => {});
  }

  function shell(title, meta, href, docMode) {
    moT.textContent = title || '';
    moMeta.textContent = meta || '';
    moCap.textContent = '';
    moCap.style.display = 'none';
    moB.textContent = '';
    moB.classList.toggle('mo__body--doc', !!docMode);
    setOpen(href);
    moPrev.style.display = moNext.style.display = 'none';
    if (!mo.classList.contains('is-open')) { back = document.activeElement; mo.classList.add('is-open'); }
    document.getElementById('mo-x').focus();
  }

  function showFrame() {
    const f = gallery[gi];
    shell(f.cap, (gi + 1) + ' / ' + gallery.length, f.src, false);
    if (res(f.src)) { const img = el('img'); img.src = res(f.src); img.alt = f.cap; moB.appendChild(img); }
    else note(NOT_INLINED, f.src);
    moPrev.style.display = moNext.style.display = gallery.length > 1 ? '' : 'none';
    moPrev.disabled = gi === 0; moNext.disabled = gi === gallery.length - 1;
  }
  const step = d => { if (!gallery) return; gi = Math.min(gallery.length - 1, Math.max(0, gi + d)); showFrame(); };
  moPrev.addEventListener('click', () => step(-1));
  moNext.addEventListener('click', () => step(1));

  function openModal(o) {
    gallery = null;
    if (o.kind === 'image' && o.gallery) { gallery = o.gallery; gi = o.index || 0; return showFrame(); }
    if ((o.kind === 'image' || o.kind === 'video') && !res(o.src)) { shell(o.title, '', o.src); return note(NOT_INLINED, o.src); }
    if (o.kind === 'image') { shell(o.title, '', o.src); const i = el('img'); i.src = res(o.src); i.alt = o.title || ''; moB.appendChild(i); return; }
    if (o.kind === 'video') {
      shell(o.title, '', o.src);
      const v = document.createElement('video');
      v.src = res(o.src); v.controls = true; v.autoplay = true; v.playsInline = true;
      v.addEventListener('error', () => note('This video could not be loaded.', o.src));
      moB.appendChild(v);
      return;
    }
    shell(o.title, o.meta, o.href, true);
  }

  function note(msg, href) {
    moB.classList.add('mo__body--doc');
    moB.textContent = '';
    const d = el('div', 'mo__note');
    d.innerHTML = msg;
    if (href) { const p = el('p'); p.appendChild(el('code', null, href)); d.appendChild(p); }
    moB.appendChild(d);
  }

  function parseDelim(text, d) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; if (rows.length > MAX_ROWS) return rows; }
      else if (c !== '\r') cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function renderTable(text, d, total) {
    const rows = parseDelim(text, d);
    if (!rows.length) return note('This file is empty.');
    const tbl = el('table', 'mo__tbl');
    const head = el('tr');
    head.appendChild(el('th', null, '#'));
    rows[0].forEach(h => head.appendChild(el('th', null, h)));
    tbl.appendChild(head);
    rows.slice(1).forEach((r, i) => {
      const tr = el('tr');
      tr.appendChild(el('td', null, String(i + 1)));
      r.forEach(c => tr.appendChild(el('td', null, c)));
      tbl.appendChild(tr);
    });
    moB.appendChild(tbl);
    const shown = rows.length - 1;
    if (total && total > shown) {
      moCap.style.display = '';
      moCap.textContent = 'Showing the first ' + shown.toLocaleString() + ' of ' + total.toLocaleString() + ' rows. Open the file for all of them.';
    }
  }

  async function openFile(x) {
    const e = extOf(x.href);
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif'].includes(e)) return openModal({ kind: 'image', title: x.label, src: x.href });
    if (['mp4', 'webm', 'mov', 'm4v'].includes(e)) return openModal({ kind: 'video', title: x.label, src: x.href });

    openModal({ title: x.label, meta: x.note || e, href: x.href });
    if (!res(x.href)) return note(NOT_INLINED, x.href);
    moB.appendChild(el('div', 'mo__note', 'Loading…'));
    try {
      const r = await fetch(res(x.href));
      if (!r.ok) throw new Error(r.status);
      let text = await r.text();
      const truncated = text.length > MAX_CHARS;
      const totalRows = (text.match(/\n/g) || []).length;
      if (truncated) text = text.slice(0, MAX_CHARS);
      moB.textContent = '';
      if (e === 'csv' || e === 'tsv') return renderTable(text, e === 'tsv' ? '\t' : ',', totalRows);
      if (e === 'json') { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {} }
      moB.appendChild(el('pre', 'mo__pre', text));
      if (truncated) { moCap.style.display = ''; moCap.textContent = 'Truncated for display. Open the file for the whole thing.'; }
    } catch (err) {
      note('<strong>This file could not be shown.</strong>', x.href);
    }
  }

  function shut() {
    mo.classList.remove('is-open');
    moB.querySelectorAll('video').forEach(v => v.pause());
    moB.textContent = ''; gallery = null;
    setOpen(null);
    if (back) back.focus();
  }
  document.getElementById('mo-x').addEventListener('click', shut);
  mo.addEventListener('click', e => { if (e.target === mo) shut(); });
  document.addEventListener('keydown', e => {
    if (!mo.classList.contains('is-open')) return;
    if (e.key === 'Escape') shut();
    if (gallery && e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    if (gallery && e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  });

  /* Proofs and screenshots are collapsed on screen. A closed <details> prints
     blank whatever the CSS says, so open them for the print and restore after. */
  let reopened = [];
  addEventListener('beforeprint', () => {
    reopened = [...document.querySelectorAll('details:not([open])')];
    reopened.forEach(d => { d.open = true; });
  });
  addEventListener('afterprint', () => {
    reopened.forEach(d => { d.open = false; });
    reopened = [];
  });

  paint();
  select(order.length ? order[0] : 'bugs');
})();
</script>
</body>
</html>
