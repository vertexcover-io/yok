name: test-audit-apply
description: >-
  Apply the test-audit fixes people accepted and revert the ones they undid, in the newest audit's
  pull request or a new one, then record each outcome on its audit result. The yok server starts
  it with the results it handed over.
policies:
  interaction: false
inputs:
  project:
    type: string
    required: true
  # [{ id, action: apply | revert }], one per result the server wrote a *_started row for
  results:
    type: array
    required: true
doctor:
  - check: binary
    key: gh
    fix: Install the GitHub CLI and run gh auth login
nodes:
  - id: audit-work
    type: exec
    runtime: sh
    script: yok orchestrate audit work
    notify: false
    input:
      results: "{{ inputs.results }}"
    output:
      zodSchema: Json

  # The newest audit's PR takes the commits while it is open; otherwise a new branch from the base.
  - id: workspace
    type: switch
    expression: "{{ nodes.audit-work.output.onPr }}"
    dependsOn: [audit-work]
    input:
      upstream: "{{ nodes.audit-work.output.upstream }}"
      repos: "{{ nodes.audit-work.output.repos }}"
    cases:
      - id: on-pr
        value: true
        nodes:
          - id: create-workspace
            type: agent
            stage: create-workspace
            notify: false
            input:
              request: Apply the accepted test-audit fixes.
              upstream: "{{ inputs.upstream }}"
              repos: "{{ inputs.repos }}"
    default:
      - id: create-workspace
        type: agent
        stage: create-workspace
        notify: false
        input:
          request: Apply the accepted test-audit fixes.
          repos: "{{ inputs.repos }}"

  - id: fix
    type: agent
    stage: fix
    dependsOn: [audit-work, workspace]
    prompt: >-
      These items come from the test audit, not from a bug report. An item whose hint is a diff:
      apply it with git apply, and when it no longer applies make the change its summary and
      trigger describe. An item whose hint is a git revert: run it. Neither needs a failing test
      first. Prove a diff by running the files it touches, all passing. Prove a revert by running
      the files it touches and showing each fails or passes as it did before the reverted commit:
      undoing a fix for a flaky or failing test brings that failure back, which is the revert
      working, so it is no new failure and never a reason to drop the revert. Only a fix(audit-apply-1 …)
      commit after the repo's startSha in the workspace input is an earlier attempt of this run;
      one at or before startSha came from an earlier apply run, so do that item again. Every other
      step of the skill holds.
    # Not test-audit's source: its fix(audit-1 ID) deletions sit on the same PR branch.
    input:
      workspace: "{{ nodes.workspace.output }}"
      fixes: "{{ nodes.audit-work.output.fixes }}"
      source: audit-apply
      round: 1

  - id: visual-pr
    type: agent
    stage: visual-pr
    dependsOn: [workspace, fix]
    input:
      workspace: "{{ nodes.workspace.output }}"
      task: Apply the test-audit fixes people accepted and revert the ones they undid.

  - id: audit-record
    type: exec
    runtime: sh
    script: yok orchestrate audit record
    notify: false
    dependsOn: [visual-pr]
    input:
      results: "{{ inputs.results }}"
    output:
      zodSchema: Json
