name: test-audit
description: >-
  Audit a project's test suite every Saturday at 02:00, unattended: run it three times and once
  with coverage, find flaky, failing, slow and duplicate tests, and save the metrics and findings
  as the project's test audit.
policies:
  interaction: false
trigger:
  cron: "0 2 * * 6"
# The limits the audit page flags against, saved with the run; the same defaults as
# TEST_AUDIT_METRICS in packages/sdk/src/audits.ts.
inputs:
  coverageLimit:
    type: number
    default: 80
  coverageChangedLimit:
    type: number
    default: 80
  testTimeLimit:
    type: number
    default: 240
  flakyTestsLimit:
    type: number
    default: 0
  duplicatesLimit:
    type: number
    default: 0
  duplicatesPctLimit:
    type: number
    default: 2
# gh: the auto-fix opens its PR with it, and a missing gh found then would fail the week's audit.
doctor:
  - check: binary
    key: python3
    fix: Install Python 3
  - check: binary
    key: gh
    fix: Install the GitHub CLI and run gh auth login
nodes:
  - id: create-workspace
    type: agent
    stage: create-workspace
    notify: false
    input:
      request: Audit the project's test suite.

  - id: audit-start
    type: exec
    runtime: sh
    script: yok orchestrate audit start
    notify: false
    dependsOn: [create-workspace]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
    output:
      zodSchema: Json

  - id: run-tests
    type: agent
    stage: run-tests
    dependsOn: [create-workspace, audit-start]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      audit: "{{ nodes.audit-start.output }}"

  - id: test-duplicates
    type: agent
    stage: test-duplicates
    dependsOn: [create-workspace, audit-start, run-tests]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      audit: "{{ nodes.audit-start.output }}"

  - id: audit-sort
    type: agent
    stage: audit-sort
    dependsOn: [create-workspace, audit-start, run-tests, test-duplicates]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      audit: "{{ nodes.audit-start.output }}"
      tests: "{{ nodes.run-tests.output }}"
      duplicates: "{{ nodes.test-duplicates.output }}"

  # fix and visual-pr run only when audit-sort auto-fixed a duplicate. The no-op default keeps the
  # switch completed, so audit-publish, which depends on it, is never skipped with a skipped fix.
  - id: autofix
    type: switch
    expression: "{{ nodes.audit-sort.output.autoFix }}"
    dependsOn: [create-workspace, run-tests, audit-sort]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      fixes: "{{ nodes.audit-sort.output.fixes }}"
      tests: "{{ nodes.run-tests.output }}"
    cases:
      - id: delete-duplicates
        value: true
        nodes:
          - id: fix
            type: agent
            stage: fix
            prompt: >-
              These items come from the weekly test audit, not from a bug report. Each one
              deletes a test that duplicates its keeper, named in the hint. A deletion has no
              failing test to write first: delete the test, then prove the item by running the
              keeper's file and the edited file, both passing. The input's tests field is this
              audit's run-tests output: a test it lists as flaky or failing in a repo failed before
              the deletion, so it is no new failure and never a reason to revert or leave an item.
              Every other step of the skill holds.
            input:
              workspace: "{{ inputs.workspace }}"
              fixes: "{{ inputs.fixes }}"
              tests: "{{ inputs.tests }}"
              source: audit
              round: 1
          - id: visual-pr
            type: agent
            stage: visual-pr
            input:
              workspace: "{{ inputs.workspace }}"
              task: Delete the duplicate tests this week's test audit found; each one's keeper stays.
    default:
      - id: no-fixes
        type: exec
        runtime: sh
        script: echo null
        notify: false
        input: {}
        output:
          zodSchema: Json

  - id: audit-publish
    type: agent
    stage: audit-publish
    dependsOn: [audit-start, run-tests, test-duplicates, audit-sort, autofix]
    input:
      audit: "{{ nodes.audit-start.output }}"
      tests: "{{ nodes.run-tests.output }}"
      duplicates: "{{ nodes.test-duplicates.output }}"
      sorted: "{{ nodes.audit-sort.output }}"

  # always: a run whose stage crashed still leaves its audit failed, never running; it reads no
  # node output (ADR 0008). allowFailure: its own failure never changes the run's status.
  - id: audit-close
    type: exec
    runtime: sh
    script: yok orchestrate audit close
    notify: false
    dependsOn: [audit-publish]
    always: true
    allowFailure: true
    input: {}
    output:
      zodSchema: Json
